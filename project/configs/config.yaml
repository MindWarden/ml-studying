data:
  raw_path: data/raw/telco_churn.csv
  target_column: Churn
  drop_columns:
    - customerID
  test_size: 0.2
  random_state: 42

preprocessing:
  numeric_features:
    - tenure
    - MonthlyCharges
    - TotalCharges
    - SeniorCitizen
  categorical_features:
    - gender
    - Partner
    - Dependents
    - PhoneService
    - MultipleLines
    - InternetService
    - OnlineSecurity
    - OnlineBackup
    - DeviceProtection
    - TechSupport
    - StreamingTV
    - StreamingMovies
    - Contract
    - PaperlessBilling
    - PaymentMethod

models:
  logreg:
    enabled: true
    params:
      max_iter: 1000
      class_weight: balanced
      random_state: 42
  random_forest:
    enabled: true
    params:
      n_estimators: 200
      max_depth: 12
      class_weight: balanced
      random_state: 42
      n_jobs: -1
  gradient_boosting:
    enabled: true
    params:
      n_estimators: 200
      max_depth: 3
      learning_rate: 0.1
      random_state: 42

artifacts:
  model_path: artifacts/model.pkl
  preprocessor_path: artifacts/preprocessor.pkl
  metrics_path: artifacts/metrics.json
