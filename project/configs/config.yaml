data:
  raw_path: data/raw/telco_churn.csv
  target_column: Churn
  drop_columns:
    - customerID
  test_size: 0.2
  random_state: 42

preprocessing:
  numeric_features:
    - tenure
    - MonthlyCharges
    - TotalCharges
    - SeniorCitizen
  categorical_features:
    - gender
    - Partner
    - Dependents
    - PhoneService
    - MultipleLines
    - InternetService
    - OnlineSecurity
    - OnlineBackup
    - DeviceProtection
    - TechSupport
    - StreamingTV
    - StreamingMovies
    - Contract
    - PaperlessBilling
    - PaymentMethod

# Базовые модели (раздел 2.1 отчёта)
models:
  logreg:
    enabled: true
    params:
      max_iter: 1000
      class_weight: balanced
      random_state: 42
  random_forest:
    enabled: true
    params:
      n_estimators: 200
      max_depth: 12
      class_weight: balanced
      random_state: 42
      n_jobs: -1
  gradient_boosting:
    enabled: true
    params:
      n_estimators: 200
      max_depth: 3
      learning_rate: 0.1
      random_state: 42

# Улучшенные модели: GridSearchCV по ROC-AUC, 5-fold StratifiedKFold (раздел 2.2)
tuning:
  logreg:
    enabled: true
    base_params:
      max_iter: 1000
      class_weight: balanced
      random_state: 42
    param_grid:
      C: [0.01, 0.1, 1.0, 10.0]
  random_forest:
    enabled: true
    base_params:
      class_weight: balanced
      random_state: 42
      n_jobs: -1
    param_grid:
      n_estimators: [200, 400]
      max_depth: [8, 12, 16]
      min_samples_leaf: [1, 3]
  gradient_boosting:
    enabled: true
    base_params:
      random_state: 42
    param_grid:
      n_estimators: [100, 200, 300]
      learning_rate: [0.05, 0.1]
      max_depth: [2, 3]
  # Нейросетевой бейзлайн: MLP поверх того же препроцессора
  mlp:
    enabled: true
    base_params:
      max_iter: 400
      early_stopping: true
      random_state: 42
    param_grid:
      hidden_layer_sizes: [[64, 32], [128, 64]]
      alpha: [0.001, 0.01]

# Подбор порога классификации: максимизация F-beta на out-of-fold
# предсказаниях train (beta=2 — recall важнее precision)
threshold:
  beta: 2

artifacts:
  model_path: artifacts/model.pkl
  metrics_path: artifacts/metrics.json
  threshold_path: artifacts/threshold.json
